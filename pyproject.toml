[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute-stream"
version = "0.1.0"
description = "NumCompute-Stream: streaming machine learning with NumPy"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools]
packages = ["numcompute_stream"]
